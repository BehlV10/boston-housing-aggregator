name: Scrape Boston Rentals & Deploy to GitHub Pages

on:
  # Run automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Run on push to main
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git push
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Boston Scraper
        run: |
          python3 scraper/scrape_boston.py

      - name: Commit Updated Listings Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-refresh Boston rental listings [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
